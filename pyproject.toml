[project]
name = "bev-energy-optimizer"
version = "0.1.0"
description = "Optimise BEV smart charging and vehicle-to-home (V2H) to minimise household electricity cost"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.9.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
